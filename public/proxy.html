<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Proxy</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101820; color: #eef5f7; }
    main { width: min(92vw, 680px); }
    h1 { font-size: 2rem; }
    form { display: flex; gap: .6rem; }
    input { flex: 1; min-width: 0; padding: .9rem; border: 1px solid #53656c; border-radius: .5rem; font-size: 1rem; }
    button { padding: .9rem 1.2rem; border: 0; border-radius: .5rem; background: #20c997; color: #09251d; font-weight: 700; cursor: pointer; }
    p { color: #c1d0d5; line-height: 1.6; }
    #error { color: #ff9a9a; }
    @media (max-width: 520px) { form { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <h1>Proxy</h1>
    <p>許可されたドメイン: YouTube、Unityroom、CrazyGames。サイトの仕様によっては、動画再生やゲームが動作しないことがあります。</p>
    <form id="proxy-form">
      <input id="target" type="url" inputmode="url" placeholder="https://www.youtube.com/" aria-label="接続先URL" required>
      <button type="submit">開く</button>
    </form>
    <p id="error" role="alert"></p>
    <form action="/logout" method="post"><button type="submit">ログアウト</button></form>
  </main>
  <script>
    const form = document.getElementById('proxy-form');
    const input = document.getElementById('target');
    const error = document.getElementById('error');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      try {
        const target = new URL(input.value.trim());
        if (target.protocol !== 'https:') throw new Error('HTTPSのURLを入力してください。');
        location.href = `/api/proxy?url=${encodeURIComponent(target.href)}`;
      } catch (e) {
        error.textContent = e.message || 'URLを確認してください。';
      }
    });
  </script>
</body>
</html>
